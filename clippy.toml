# Randomness must come through `getrandom` or `ssh-stamp-esp32-entropy`, which
# refuse to produce it while no entropy source is active.
disallowed-types = [
    "esp_hal::rng::Rng",
    { path = "esp_hal::rng::Trng", allow-invalid = true },
    { path = "esp_hal::rng::TrngSource", allow-invalid = true },
]
