[alias]
# All ESP32 targets build the binary in the ssh-stamp-esp32 crate.
# Board features select a specific PCB and imply the IC feature.
# `--no-default-features` prevents the default board from clashing.
#
# Boards with a BSP entry use a board-<name> feature:
build-esp32c5 = "build --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c5-devkitc,mlkem"
build-esp32c61 = "build --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c61-devkitc,mlkem"
build-esp32c6 = "build --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c6-devkitc,mlkem"
build-esp32s2 = "build --release --target xtensa-esp32s2-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32-s2-saola,mlkem -Z build-std=core,alloc"
build-esp32s3-touch-lcd-43 = "build --release --target xtensa-esp32s3-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-waveshare-esp32-s3-touch-lcd-43,can,mlkem -Z build-std=core,alloc"
# Bench variant: CAN in no-acknowledge mode (exactly one frame per write with no ACKing node attached)
build-esp32s3-touch-lcd-43-noack = "build --release --target xtensa-esp32s3-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-waveshare-esp32-s3-touch-lcd-43,can-no-ack,mlkem -Z build-std=core,alloc"

run-esp32c5 = "run --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c5-devkitc,mlkem"
run-esp32c61 = "run --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c61-devkitc,mlkem"
run-esp32c6 = "run --release --target riscv32imac-unknown-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32c6-devkitc,mlkem"
run-esp32s2 = "run --release --target xtensa-esp32s2-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-esp32-s2-saola,mlkem"
run-esp32s3-touch-lcd-43 = "run --release --target xtensa-esp32s3-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-waveshare-esp32-s3-touch-lcd-43,can,mlkem -Z build-std=core,alloc"
run-esp32s3-touch-lcd-43-noack = "run --release --target xtensa-esp32s3-none-elf -p ssh-stamp-esp32 --bin ssh-stamp-esp32 --no-default-features --features board-waveshare-esp32-s3-touch-lcd-43,can-no-ack,mlkem -Z build-std=core,alloc"

# IC-only targets (no BSP entry yet) build the library only — the binary hits
# the `compile_error!("No board feature selected.")` guard until a board module
# is added to ssh-stamp-esp32-boards. Use `--lib` so the alias succeeds.
build-esp32 = "build --release --target xtensa-esp32-none-elf -p ssh-stamp-esp32 --lib --no-default-features --features esp32,mlkem -Z build-std=core,alloc"
build-esp32c2 = "build --release --target riscv32imc-unknown-none-elf -p ssh-stamp-esp32 --lib --no-default-features --features esp32c2,mlkem"
build-esp32c3 = "build --release --target riscv32imc-unknown-none-elf -p ssh-stamp-esp32 --lib --no-default-features --features esp32c3,mlkem"
build-esp32s3 = "build --release --target xtensa-esp32s3-none-elf -p ssh-stamp-esp32 --lib --no-default-features --features esp32s3,mlkem -Z build-std=core,alloc"

# Test alias
test-ota = "test --package ota"

# ota packer aliases.
build-packer = "build --package ota --bin packer --features std"
packer = "run --package ota --bin packer --features std"

# doc aliases (cannot use "doc" — shadows cargo's built-in command)
build-doc = "doc --target riscv32imac-unknown-none-elf --no-deps --lib -p ssh-stamp -p ssh-stamp-hal -p ssh-stamp-esp32 -p ssh-stamp-esp32-boards -p ota --no-default-features --features ssh-stamp-esp32/board-esp32c6-devkitc"

# Benchmark and automation runner.
xtask = "run --manifest-path xtask/Cargo.toml --release --"

# Enforce arithmetic overflow checks on every target.
[target.'cfg(target_os = "none")']
rustflags = ["-C", "overflow-checks=on"]

[target.xtensa-esp32-none-elf] # ESP32
runner = "espflash flash --baud=921600 --monitor --chip esp32"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32"']
[target.riscv32imc-unknown-none-elf] # ESP32-C2 / ESP32-C3
runner = "espflash flash --baud=921600 --monitor"
rustflags = ["-C", "force-frame-pointers"]
[target.riscv32imac-unknown-none-elf] # ESP32C6
runner = "espflash flash --baud=921600 --partition-table ssh-stamp-esp32/partitions.csv --monitor"
rustflags = ["-C", "force-frame-pointers"]

[target.xtensa-esp32s2-none-elf] # ESP32-S2
runner = "espflash flash --baud=921600 --monitor --chip esp32s2"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32s2"']
[target.xtensa-esp32s3-none-elf] # ESP32-S3
runner = "espflash flash --baud=921600 --monitor --chip esp32s3"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32s3"']


# https://docs.espressif.com/projects/rust/esp-hal/1.0.0-beta.1/esp32c6/esp_hal/index.html#additional-configuration
[env]
ESP_LOG = "info"
#ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM=true
#ESP_HAL_CONFIG_PLACE_ANON_IN_RAM=false
#ESP_HAL_CONFIG_FLIP_LINK=false
#ESP_HAL_CONFIG_STACK_GUARD_OFFSET=4096
#ESP_HAL_CONFIG_STACK_GUARD_VALUE=3740121773
#ESP_HAL_CONFIG_IMPL_CRITICAL_SECTION=true

# Neither build nor target should be specified, as it forces every host alias to override it.
