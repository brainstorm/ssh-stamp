[alias]
# Every build goes through the xtask runner: `cargo xtask <command>` for
# project tasks, `cargo xtask <target> <cargo command...>` to forward any
# cargo command line to a board or chip. Board/chip/toolchain knowledge
# lives in xtask/src/board.rs, instead of one alias per board*feature
# combination (see issue #116).
#
#   cargo xtask list
#   cargo xtask esp32c6-devkitc build --release
#   cargo xtask waveshare-esp32-s3-touch-lcd-43 run --release --features can-no-ack
xtask = "run --package xtask --release --"

# The OTA image packer is a host tool, not a build target. `std` satisfies
# the binary's `required-features`.
packer = "run --package ota --bin packer --features std"

# NOTE: there is deliberately no `[build] target` or `[unstable] build-std`
# here. Both used to be global, which forced *every* cargo invocation —
# including host tools like xtask and the packer — to cross-compile to
# riscv32imac. xtask now passes `--target` and `-Zbuild-std` per chip, so
# host tooling builds for the host on any OS without a hardcoded triple.
# Editors wanting cross-compilation diagnostics should set the target in
# their own rust-analyzer config, e.g.:
#   "rust-analyzer.cargo.target": "riscv32imac-unknown-none-elf"

# Enforce arithmetic overflow checks on every target.
[target.'cfg(target_os = "none")']
rustflags = ["-C", "overflow-checks=on"]

[target.xtensa-esp32-none-elf] # ESP32
runner = "espflash flash --baud=921600 --monitor --chip esp32"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32"', '--cfg', 'getrandom_backend="custom"']
[target.riscv32imc-unknown-none-elf] # ESP32-C2 / ESP32-C3
runner = "espflash flash --baud=921600 --monitor"
rustflags = ["-C", "force-frame-pointers", '--cfg', 'getrandom_backend="custom"']
[target.riscv32imac-unknown-none-elf] # ESP32-C5 / C6 / C61
runner = "espflash flash --baud=921600 --partition-table ssh-stamp-esp32/partitions.csv --monitor"
rustflags = ["-C", "force-frame-pointers", '--cfg', 'getrandom_backend="custom"']

# Bouffalo BL616. Hard-float: the vendor WiFi archives are ilp32f, so this is
# riscv32imafc and not the imac used above -- linking ilp32 objects against
# them fails, and an earlier BL616 attempt in this repo used imac because it
# had no blobs to link yet.
#
# No runner here: the image needs a bootheader and post-processing that
# espflash does not do, so flashing goes through the board entry in xtask.
[target.riscv32imafc-unknown-none-elf] # Bouffalo BL616
# GCC drives the link, not rust-lld. The vendor archives are GCC-LTO (GIMPLE),
# which only the GCC driver can consume, and binutils 2.35 cannot parse LLVM's
# Tag_RISCV_arch — hence bfd and --no-warn-mismatch. rustc passes
# -fuse-ld=lld first and the last flag wins, which is why ours comes after.
linker = "riscv64-unknown-elf-gcc"
rustflags = [
    "-C", "force-frame-pointers",
    '--cfg', 'getrandom_backend="custom"',
    "-C", "linker-flavor=gcc",
    "-C", "link-arg=-fuse-ld=bfd",
    "-C", "link-arg=-Wl,--no-warn-mismatch",
]

[target.xtensa-esp32s2-none-elf] # ESP32-S2
runner = "espflash flash --baud=921600 --monitor --chip esp32s2"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32s2"', '--cfg', 'getrandom_backend="custom"']
[target.xtensa-esp32s3-none-elf] # ESP32-S3
runner = "espflash flash --baud=921600 --monitor --chip esp32s3"
rustflags = ["-C", "link-arg=-nostartfiles", '--cfg=feature="esp32s3"', '--cfg', 'getrandom_backend="custom"']


# https://docs.espressif.com/projects/rust/esp-hal/1.0.0-beta.1/esp32c6/esp_hal/index.html#additional-configuration
[env]
ESP_LOG = "info"
#ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM=true
#ESP_HAL_CONFIG_PLACE_ANON_IN_RAM=false
#ESP_HAL_CONFIG_FLIP_LINK=false
#ESP_HAL_CONFIG_STACK_GUARD_OFFSET=4096
#ESP_HAL_CONFIG_STACK_GUARD_VALUE=3740121773
#ESP_HAL_CONFIG_IMPL_CRITICAL_SECTION=true
