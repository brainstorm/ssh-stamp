[package]
name = "ssh-stamp-ota"
description = "SFTP-based over-the-air firmware updates for ssh-stamp"
documentation = "https://docs.rs/ssh-stamp-ota"
authors = ["Julio Beltran Ortega <jubeormk1@gmail.com>"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The OTA server is only compiled for bare-metal targets, so document it there.
[package.metadata.docs.rs]
features = ["sftp"]
default-target = "riscv32imac-unknown-none-elf"
targets = []
rustc-args = ["--cfg", 'getrandom_backend="custom"']
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
std = []
sftp = ["dep:sunset-sftp"]

[dependencies]
ssh-stamp-hal = { workspace = true }
sunset.workspace = true
sunset-async.workspace = true
sunset-sftp = { workspace = true, optional = true }

log.workspace = true
sha2.workspace = true

# Only for helpers and tests
[target.'cfg(not(target_os = "none"))'.dependencies]
clap = "4.5"

[lints]
workspace = true

[[bin]]
name = "packer"
path = "src/bin/packer.rs"
required-features = ["std"]
