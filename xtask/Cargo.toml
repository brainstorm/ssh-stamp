[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints.clippy]
mem_forget = "warn"
await_holding_lock = "warn"
pedantic = "warn"
large_futures = { level = "allow", priority = 1 }
default_trait_access = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
espflash = { version = "4", default-features = false }
quick-xml = { version = "0.38", default-features = false }
tempfile = "3"
humansize = "2"
statrs = { version = "0.19", default-features = false }
object = { version = "0.37", default-features = false, features = [
    "read",
    "elf",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial2 = "0.2"
strip-ansi-escapes = "0.2"
toml = "0.8"
xshell = "0.2"
probe-rs = "0.32"
