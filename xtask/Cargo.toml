[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
espflash = { version = "4", default-features = false }
esp-idf-part = "0.6"
quick-xml = { version = "0.41", default-features = false }
tempfile = "3"
humansize = "2"
statrs = { version = "0.19", default-features = false }
object = { version = "0.37", default-features = false, features = [
    "read",
    "elf",
    "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial2 = "0.2"
strip-ansi-escapes = "0.2"
xshell = "0.2"
probe-rs = "0.32"
probe-rs-espressif = "0.32"
