[package]
name = "ssh-stamp-esp32-boards"
authors = ["Roman Valls Guimera <brainstorm@nopcode.org>"]
description = "Board Support Package — per-PCB pin mappings for ssh-stamp-esp32"
documentation = "https://docs.rs/ssh-stamp-esp32-boards"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# All boards at once, so the generated pin catalog on the front page lists
# every board rather than just one.
[package.metadata.docs.rs]
all-features = true
default-target = "riscv32imac-unknown-none-elf"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[features]
board-esp32c5-devkitc = []
board-esp32c61-devkitc = []
board-esp32c6-devkitc = []
board-esp32-s2-saola = []
board-waveshare-esp32-s3-touch-lcd-43 = []

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true