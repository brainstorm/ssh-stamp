  <title
     id="title1">SSH Stamp architecture</title>
  <defs
     id="defs1">
    <style
       id="style1">
      .stage{ font: 700 13px &quot;Noto Sans Mono&quot;, monospace; fill: #c2d4e8; letter-spacing: 0.3em; }
      .h1   { font: 700 15px &quot;Noto Sans Mono&quot;, monospace; fill: #7cf29b; letter-spacing: 0.08em; }
      .lbl  { font: 600 13px &quot;Noto Sans Mono&quot;, monospace; fill: #e6eef8; }
      .sub  { font: 400 12px &quot;Noto Sans Mono&quot;, monospace; fill: #8ea0b6; }
      .sub-small{ font: 400 10px &quot;Noto Sans Mono&quot;, monospace; fill: #8ea0b6; }
      .pin  { font: 600 13px &quot;Noto Sans Mono&quot;, monospace; fill: #ffb454; }
      .flow { font: 600 10px &quot;Noto Sans Mono&quot;, monospace; fill: #7cf29b; letter-spacing: 0.18em; }
      .tunnel-lbl { font: 600 10px &quot;Noto Sans Mono&quot;, monospace; fill: #7cf29b; letter-spacing: 0.18em; }
      .box  { fill: #0f1720; stroke: #2b3d55; stroke-width: 1.5; }
      .card { fill: #0a1119; stroke: #7cf29b; stroke-width: 1.2; }
      .rail { stroke: #7cf29b; stroke-width: 1.5; fill: none; }
      .tunnel{ fill: #7cf29b; fill-opacity: 0.08; stroke: #7cf29b; stroke-opacity: 0.55; stroke-width: 1; stroke-dasharray: 4 2; }
      .dot  { fill: #7cf29b; }
      .sep  { stroke: #2b3d55; stroke-width: 1; fill: none; opacity: 0.45; }
      .badge-ok { fill: #163a26; stroke: #3fae67; stroke-width: 1; }
      .badge-ok-txt { font: 700 9px &quot;Noto Sans Mono&quot;, monospace; fill: #7cf29b; letter-spacing: 0.04em; }
      .badge-plan { fill: #3a1d1d; stroke: #e05a5a; stroke-width: 1; }
      .badge-plan-txt { font: 700 9px &quot;Noto Sans Mono&quot;, monospace; fill: #ff8a7c; letter-spacing: 0.04em; }
    </style>
