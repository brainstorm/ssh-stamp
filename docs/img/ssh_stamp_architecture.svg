     x="760"
     y="182"
     text-anchor="middle"
     id="text16">WIRES</text>
  <!-- 1. YOU -->
  <g
     transform="translate(55,130)"
     id="g20">
    <rect
       class="box"
       width="150"
       height="130"
       rx="10"
       id="rect16" />
    <text
       class="h1"
       x="14"
       y="30"
       id="text17">YOU</text>
    <text
       class="lbl"
       x="14"
       y="60"
       id="text18">computer</text>
    <text
       class="sub"
       x="14"
       y="86"
       id="text19">Any SSH client</text>
    <text
       class="sub"
       x="14"
       y="108"
       id="text20">$ ssh root@stamp</text>
  </g>
  <!-- 2. Network -->
  <g
     transform="translate(275,130)"
     id="g24">
    <rect
       class="box"
       width="210"
       height="130"
       rx="10"
       id="rect20" />
    <text
       class="h1"
       x="14"
       y="30"
       id="text21">NETWORK</text>
    <text
       class="lbl"
       x="14"
       y="60"
       id="text22">Wi-Fi or Ethernet</text>
    <text
       class="sub"
       x="14"
       y="86"
       id="text23">WPA2 · AP or Station</text>
    <text
       class="sub"
       x="14"
       y="108"
       id="text24">Random PSK on first boot</text>
  </g>
