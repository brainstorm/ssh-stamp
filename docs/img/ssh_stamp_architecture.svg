<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1060 290"
   role="img"
   aria-label="SSH Stamp architecture: a computer connects over a secure SSH tunnel through Wi-Fi or Ethernet to an ESP32 running an SSH server that bridges to the target's pins. UART and CAN are supported; I2C and GPIO are planned."
   version="1.1"
   id="svg36"
   sodipodi:docname="ssh-stamp-architecture.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview36"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="6.2886792"
     inkscape:cx="922.61026"
     inkscape:cy="183.82238"
