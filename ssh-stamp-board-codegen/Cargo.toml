[package]
name = "ssh-stamp-board-codegen"
version = "0.1.0"
edition = "2024"
authors = ["Roman Valls Guimera <brainstorm@nopcode.org>"]
description = "Board Support Package codegen shared by the ssh-stamp BSP build scripts"
license = "GPL-3.0-or-later"
repository = "https://github.com/brainstorm/ssh-stamp"

# Short path for build scripts: `board_codegen::emit::…`.
[lib]
name = "board_codegen"

# Host-side crate: build scripts always compile for the host, so unlike every
# other member of this workspace it is a normal `std` crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints]
workspace = true
