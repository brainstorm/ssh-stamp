# Fixture: a board with a URL and the optional extension section.
url = "https://example.invalid/alpha"

[pins]
uart_rx = 10
uart_tx = 11
# An extra key inside [pins]: the loader must ignore keys it does not
# name, and the extension must still be able to read them.
widget_pin = 7

[widget]
enabled = true
