# Release workflow: builds pre-compiled firmware binaries for all ports/targets,
# generates an SBOM (SPDX) using Anchore Syft, and attaches everything to a
# GitHub Release.
#
# Triggered by pushing a version tag (e.g. v0.3.0).
#
# NOTE on release-plz: release-plz is designed for publishing Rust *crates* to
# crates.io (version bumping, changelogs, cargo publish). Since ssh-stamp is a
# no_std firmware project whose artifacts are flashable .bin/.elf images rather
# than library crates, release-plz is not a good fit. Instead this workflow uses
# a tag-driven approach with softprops/action-gh-release.
#
# SBOM tooling: anchore/sbom-action runs Syft on the source tree (Cargo.lock
# + Cargo.toml) to produce an SPDX JSON SBOM covering all Rust dependencies.
# The resulting sbom.spdx.json is attached to the release for supply-chain
# transparency.
#
# CVE tooling: cargo-audit checks Cargo.lock against the RustSec advisory
# database. It is used in preference to SBOM-consuming scanners because those
# match Rust crates poorly -- Grype, fed this exact SBOM, missed both
# high-severity quick-xml advisories that cargo-audit catches. Note that
# bootlin/sbom-cve-check cannot consume this SBOM at all: its spdx2 backend
# only accepts Yocto-style SPDX2 trees, and its spdx3 backend needs true
# SPDX 3.0, which Syft does not emit.
#
# `unmaintained` advisories are reported as warnings and do not fail the
# release; only actual vulnerabilities do.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.3.0)'
        required: true

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

  build-firmware:
    name: Build ${{ matrix.target.soc }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - soc: esp32c6
            board: esp32c6-devkitc
            triple: riscv32imac-unknown-none-elf
            xtensa: false
          - soc: esp32s2
            board: esp32-s2-saola
            triple: xtensa-esp32s2-none-elf
            xtensa: true
          - soc: esp32s3
            board: waveshare-esp32-s3-touch-lcd-43
            triple: xtensa-esp32s3-none-elf
            xtensa: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Rust toolchain for RISC-V
        if: ${{ !matrix.target.xtensa }}
        uses: dtolnay/rust-toolchain@v1
        with:
          target: ${{ matrix.target.triple }}
          toolchain: stable
          components: rust-src

      - name: Setup Rust toolchain for Xtensa
        if: ${{ matrix.target.xtensa }}
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          version: 1.95.0.0

      - name: Build firmware
        run: cargo xtask ${{ matrix.target.board }} build --release

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Generate .bin image from ELF
        run: |
          mkdir -p release-assets
          ELF_PATH="target/boards/${{ matrix.target.board }}/${{ matrix.target.triple }}/release/ssh-stamp-esp32"
          espflash save-image --chip ${{ matrix.target.soc }} --partition-table ssh-stamp-esp32/partitions.csv "$ELF_PATH" "release-assets/ssh-stamp-${{ matrix.target.soc }}.bin"
          cp "$ELF_PATH" "release-assets/ssh-stamp-${{ matrix.target.soc }}.elf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target.soc }}
          path: release-assets/
          retention-days: 1

  cve-check:
    name: CVE check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Report first, gate last: cargo-audit writes a valid JSON report even
      # when it finds advisories, so `|| true` lets the upload below run either
      # way. Anything that breaks the scan itself still fails the gate step.
      - name: Generate CVE report
        run: cargo audit --json > cve-report.json || true

      - name: Upload CVE report
        uses: actions/upload-artifact@v7
        with:
          name: cve-report
          path: cve-report.json

      # The gate. Also the only human-readable output: with --json above,
      # cargo-audit writes nothing to stderr, so this is what shows which
      # advisory failed the release.
      - name: Check for advisories
        run: cargo audit

  publish-release:
    name: Publish GitHub Release
    needs: [generate-sbom, build-firmware, cve-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom.spdx.json
          path: release-assets/

      - name: Download CVE report artifact
        uses: actions/download-artifact@v8
        with:
          name: cve-report
          path: release-assets/

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
