# Release workflow: builds a pre-compiled firmware image for every supported
# board, generates an SBOM (SPDX) using Anchore Syft, and attaches everything to
# a GitHub Release.
#
# Assets are named per board (ssh-stamp-<board>.bin/.elf), not per SoC: several
# boards can share a SoC while differing in pinout and features, so their images
# are not interchangeable.
#
# Triggered by pushing a version tag (e.g. v0.3.0).
#
# NOTE on release-plz: release-plz is designed for publishing Rust *crates* to
# crates.io (version bumping, changelogs, cargo publish). Since ssh-stamp is a
# no_std firmware project whose artifacts are flashable .bin/.elf images rather
# than library crates, release-plz is not a good fit. Instead this workflow uses
# a tag-driven approach with softprops/action-gh-release.
#
# SBOM tooling: anchore/sbom-action runs Syft on the source tree (Cargo.lock
# + Cargo.toml) to produce an SPDX JSON SBOM covering all Rust dependencies.
# The resulting sbom.spdx.json is attached to the release for supply-chain
# transparency.
#
# CVE tooling: cargo-audit checks Cargo.lock against the RustSec advisory
# database. It is used in preference to SBOM-consuming scanners because those
# match Rust crates poorly -- Grype, fed this exact SBOM, missed both
# high-severity quick-xml advisories that cargo-audit catches. Note that
# bootlin/sbom-cve-check cannot consume this SBOM at all: its spdx2 backend
# only accepts Yocto-style SPDX2 trees, and its spdx3 backend needs true
# SPDX 3.0, which Syft does not emit.
#
# `unmaintained` advisories are reported as warnings and do not fail the
# release; only actual vulnerabilities do.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.3.0)'
        required: true

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

  build-firmware:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One entry per board in `BOARDS` (xtask/src/board.rs, `cargo xtask list`),
      # which stays the source of truth for triple, profile and features. Release
      # assets are named per board rather than per SoC: a SoC can back several
      # boards, whose pinouts and features differ, so the images are not
      # interchangeable.
      matrix:
        board:
          - name: esp32c5-devkitc
            soc: esp32c5
            triple: riscv32imac-unknown-none-elf
            xtensa: false
            partitions: true
          - name: esp32c6-devkitc
            soc: esp32c6
            triple: riscv32imac-unknown-none-elf
            xtensa: false
            partitions: true
          - name: esp32c61-devkitc
            soc: esp32c61
            triple: riscv32imac-unknown-none-elf
            xtensa: false
            partitions: true
          # No partition table for this board; see `partitions: None` in board.rs.
          - name: esp32-s2-saola
            soc: esp32s2
            triple: xtensa-esp32s2-none-elf
            xtensa: true
            partitions: false
          - name: waveshare-esp32-s3-touch-lcd-43
            soc: esp32s3
            triple: xtensa-esp32s3-none-elf
            xtensa: true
            partitions: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Rust toolchain for RISC-V
        if: ${{ !matrix.board.xtensa }}
        uses: dtolnay/rust-toolchain@v1
        with:
          target: ${{ matrix.board.triple }}
          toolchain: stable
          components: rust-src

      - name: Setup Rust toolchain for Xtensa
        if: ${{ matrix.board.xtensa }}
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          version: 1.95.0.0

      - name: Build firmware
        run: cargo xtask ${{ matrix.board.name }} build --release

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Generate .bin image from ELF
        run: |
          mkdir -p release-assets
          ELF_PATH="target/boards/${{ matrix.board.name }}/${{ matrix.board.triple }}/release/ssh-stamp-esp32"
          # Mirrors xtask's flash path: the partition table is passed only for
          # boards that declare one.
          args=(--chip "${{ matrix.board.soc }}")
          if [ "${{ matrix.board.partitions }}" = "true" ]; then
            args+=(--partition-table ssh-stamp-esp32/partitions.csv)
          fi
          espflash save-image "${args[@]}" "$ELF_PATH" "release-assets/ssh-stamp-${{ matrix.board.name }}.bin"
          cp "$ELF_PATH" "release-assets/ssh-stamp-${{ matrix.board.name }}.elf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board.name }}
          path: release-assets/
          retention-days: 1

  cve-check:
    name: CVE check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Report first, gate last: cargo-audit writes a valid JSON report even
      # when it finds advisories, so `|| true` lets the upload below run either
      # way. Anything that breaks the scan itself still fails the gate step.
      - name: Generate CVE report
        run: cargo audit --json > cve-report.json || true

      - name: Upload CVE report
        uses: actions/upload-artifact@v7
        with:
          name: cve-report
          path: cve-report.json

      # The gate. Also the only human-readable output: with --json above,
      # cargo-audit writes nothing to stderr, so this is what shows which
      # advisory failed the release.
      - name: Check for advisories
        run: cargo audit

  publish-release:
    name: Publish GitHub Release
    needs: [generate-sbom, build-firmware, cve-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom.spdx.json
          path: release-assets/

      - name: Download CVE report artifact
        uses: actions/download-artifact@v8
        with:
          name: cve-report
          path: release-assets/

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
