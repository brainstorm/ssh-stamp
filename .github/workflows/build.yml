name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  targets:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Just the target name plus which toolchain has to be installed before
      # xtask can run. Everything else (triple, profile, features, build-std)
      # comes from xtask/src/board.rs, see `cargo xtask list`.
      matrix:
        target: [
            # Chips without a BSP entry, i.e. library-only builds.
            { name: "esp32c2", xtensa: false },
            { name: "esp32c3", xtensa: false },
            { name: "esp32", xtensa: true },
            { name: "esp32s3", xtensa: true },
            # Boards, i.e. full firmware binaries.
            { name: "esp32c5-devkitc", xtensa: false },
            { name: "esp32c6-devkitc", xtensa: false },
            { name: "esp32c61-devkitc", xtensa: false },
            { name: "esp32-s2-saola", xtensa: true },
            { name: "waveshare-esp32-s3-touch-lcd-43", xtensa: true },
        ]
    steps:
      - name: Cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain for RISC-V
        if: ${{ !matrix.target.xtensa }}
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          toolchain: stable
          components: rust-src, clippy, rustfmt
      - name: Setup Rust toolchain for Xtensa
        if: ${{ matrix.target.xtensa }}
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          version: 1.96.0

      - name: Build
        run: cargo xtask ${{ matrix.target.name }} build --release
      # Per-target so chip-gated code (`cfg(feature = "esp32")`, ...) is
      # linted too, not just what the esp32c6-devkitc build compiles.
      - name: Clippy
        run: cargo xtask ${{ matrix.target.name }} clippy --release -- -D warnings

  lint:
    name: Lints and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Firmware clippy runs per target in the build matrix above.
      - name: Clippy host tools
        run: cargo clippy -p xtask --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  packer:
    name: OTA Packer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build utility
        run: cargo build --package ota --bin packer --features std

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imac-unknown-none-elf
          toolchain: stable
      - name: Build all docs
        run: cargo xtask esp32c6-devkitc doc --no-deps --lib --workspace --exclude xtask
      - name: Check doc warnings
        run: cargo xtask esp32c6-devkitc doc --no-deps --lib --workspace --exclude xtask 2>&1 | grep -iE "broken|warning.*link" || true
