name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  targets:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Just the target name plus which toolchain has to be installed before
      # xtask can run. Everything else (triple, profile, features, build-std)
      # comes from xtask/src/board.rs, see `cargo xtask list`.
      #
      # `extra_features` applies the additional features for lints, only using
      # one representative board to avoid re-compiling everything unnecessarily.
      matrix:
        target: [
            # Chips without a BSP entry, i.e. library-only builds.
            { name: "esp32c2", xtensa: false },
            { name: "esp32c3", xtensa: false },
            { name: "esp32", xtensa: true },
            { name: "esp32s3", xtensa: true },
            # Boards, i.e. full firmware binaries.
            { name: "esp32c5-devkitc", xtensa: false },
            { name: "esp32c6-devkitc", xtensa: false, extra_features: "sftp-ota,mem-probe,bench-loopback,ipv6" },
            { name: "esp32c61-devkitc", xtensa: false },
            { name: "esp32-s2-saola", xtensa: true },
            { name: "waveshare-esp32-s3-touch-lcd-43", xtensa: true, extra_features: "can-no-ack" },
        ]
    steps:
      - name: Cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust toolchain for RISC-V
        if: ${{ !matrix.target.xtensa }}
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf
          toolchain: stable
          components: rust-src, clippy, rustfmt
      - name: Setup Rust toolchain for Xtensa
        if: ${{ matrix.target.xtensa }}
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          version: 1.96.0

      - name: Build
        run: cargo xtask ${{ matrix.target.name }} build --release
      # Per-target so chip-gated code (`cfg(feature = "esp32")`, ...) is
      # linted too, not just what the esp32c6-devkitc build compiles.
      - name: Clippy
        run: cargo xtask ${{ matrix.target.name }} clippy --release -- -D warnings
      # Also apply clippy to all features for the boards, to make sure that
      # everything gets linted.
      - name: Clippy with extra features.
        if: matrix.target.extra_features
        run: cargo xtask ${{ matrix.target.name }} clippy --release --features ${{ matrix.target.extra_features }} -- -D warnings

  lint:
    name: Lints and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Firmware clippy runs per target in the build matrix above. This
      # lints every host crate instead, the default set already includes
      # xtask and ota.
      - name: Clippy host crates
        run: cargo clippy --all-targets --features ota/std -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  packer:
    name: OTA Packer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build utility
        run: cargo build --package ota --bin packer --features std

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imac-unknown-none-elf
          toolchain: stable
      # ssh-stamp-bl616 is excluded: documenting it compiles the Bouffalo
      # vendor SDK, which needs BL_SDK_BASE and a RISC-V GCC that no runner
      # here has. Its board support crate is pure Rust and stays in.
      - name: Build all docs
        run: cargo xtask esp32c6-devkitc doc --no-deps --lib --workspace --exclude xtask --exclude ssh-stamp-bl616
      - name: Check doc warnings
        run: cargo xtask esp32c6-devkitc doc --no-deps --lib --workspace --exclude xtask --exclude ssh-stamp-bl616 2>&1 | grep -iE "broken|warning.*link" || true
