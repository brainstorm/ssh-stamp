name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  targets:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Just the target name plus which toolchain has to be installed before
      # xtask can run. Everything else (triple, profile, features, build-std)
      # comes from xtask/targets.toml — see `cargo xtask list`.
      matrix:
        target: [
            # Chips without a BSP entry: library-only builds.
            { name: "esp32c2", xtensa: false },
            { name: "esp32c3", xtensa: false },
            { name: "esp32", xtensa: true },
            { name: "esp32s3", xtensa: true },
            # Boards: full firmware binaries.
            { name: "esp32c5-devkitc", xtensa: false },
            { name: "esp32c6-devkitc", xtensa: false },
            { name: "esp32c61-devkitc", xtensa: false },
            { name: "esp32c6-generic", xtensa: false },
            { name: "esp32-s2-saola", xtensa: true },
            { name: "waveshare-esp32-s3-touch-lcd-43", xtensa: true },
            { name: "w6300-evb-pico2", xtensa: false },
        ]
    steps:
      - name: Cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Checkout code
        uses: actions/checkout@v6
      # Everything upstream ships a prebuilt core for: the RISC-V ESP32s and
      # the Arm RP2350. Xtensa is the exception and needs the esp-rs fork.
      - name: Setup Rust toolchain for RISC-V and Arm
        if: ${{ !matrix.target.xtensa }}
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imc-unknown-none-elf,riscv32imac-unknown-none-elf,thumbv8m.main-none-eabihf
          toolchain: stable
          components: rust-src, clippy, rustfmt
      - name: Setup Rust toolchain for Xtensa
        if: ${{ matrix.target.xtensa }}
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          version: 1.96.0

      - name: Build
        run: cargo xtask build ${{ matrix.target.name }}

  lint:
    name: Lints and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      # Both triples: `xtask clippy` walks one board per platform.
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imac-unknown-none-elf,thumbv8m.main-none-eabihf
          toolchain: stable
          components: rust-src, clippy, rustfmt
      - name: Clippy
        run: cargo xtask clippy
      - name: Format
        run: cargo xtask fmt --check

  packer:
    name: OTA Packer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build utility
        run: cargo build --package ota --bin packer

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Both triples: `xtask doc` renders one tree per platform.
      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          target: riscv32imac-unknown-none-elf,thumbv8m.main-none-eabihf
          toolchain: stable
      - name: Build all docs
        run: cargo xtask doc
      - name: Check doc warnings
        run: cargo xtask doc 2>&1 | grep -iE "broken|warning.*link" || true
